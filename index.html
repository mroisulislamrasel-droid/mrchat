<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MR Chat Room</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#0d041e;color:#fff}

#roomScreen{
  position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;
  background:radial-gradient(circle at 50% 20%, #7d1a9e 0%, #3d0757 50%, #100323 100%);
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden
}

/* TOP HEADER */
.top-bar{
  height:55px;padding:8px 10px;display:flex;align-items:center;
  justify-content:space-between;z-index:10;background:rgba(0,0,0,0.15)
}
.room-profile{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.3);padding:4px 8px;border-radius:20px}
.avatar-thumb{width:36px;height:36px;border-radius:50%;border:1px solid #ffd700;object-fit:cover}
.room-meta b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.room-meta small{font-size:9px;color:#ddd;display:flex;gap:4px}

.top-center-tag{
  background:linear-gradient(90deg,#3b82f6,#ec4899);padding:3px 8px;border-radius:12px;
  font-size:10px;font-weight:bold;display:flex;align-items:center;gap:4px
}

.top-right-actions{display:flex;align-items:center;gap:10px}
.circle-btn{
  width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#fff;cursor:pointer
}

.trophy-badge{
  position:absolute;top:60px;left:10px;background:rgba(0,0,0,0.3);
  padding:3px 10px;border-radius:12px;font-size:11px;color:#ffd700;font-weight:bold
}

/* HOST AREA */
.host-container{
  margin-top:20px;display:flex;flex-direction:column;align-items:center;z-index:5
}
.host-avatar-wrap{
  position:relative;width:75px;height:75px;display:flex;align-items:center;justify-content:center
}
.host-avatar-wrap::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  background:linear-gradient(45deg, #ff007f, #ffd700, #ff007f);
  box-shadow:0 0 15px #ff007f;z-index:1
}
.host-img{width:70px;height:70px;border-radius:50%;object-fit:cover;z-index:2;position:relative}
.host-title{margin-top:4px;font-size:12px;font-weight:bold;color:#60a5fa}

/* LOGO TEXT */
.brand-title{
  text-align:center;font-size:38px;font-weight:900;
  background:linear-gradient(180deg,#ffffff,#d8b4fe,#a855f7);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 20px rgba(168,85,247,0.6);margin:-5px 0 10px
}

/* SEAT GRID 1-8 */
.seats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:15px 5px;
  padding:0 20px;z-index:5
}
.seat-item{display:flex;flex-direction:column;align-items:center;position:relative}
.seat-icon{
  width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25);display:flex;align-items:center;
  justify-content:center;font-size:20px;box-shadow:inset 0 0 8px rgba(255,255,255,0.2)
}
.seat-num{font-size:11px;color:#ccc;margin-top:4px;font-weight:bold}

/* MASCOT CHARNER & FLOATING WIDGETS */
.middle-art{
  position:relative;height:120px;display:flex;justify-content:center;align-items:center
}
.mascot-img{height:130px;filter:drop-shadow(0 5px 10px rgba(0,0,0,0.5))}

.side-widgets{
  position:absolute;right:10px;bottom:0;display:flex;flex-direction:column;gap:8px
}
.widget-box{
  width:55px;height:55px;background:rgba(0,0,0,0.4);border-radius:10px;
  border:1px solid rgba(255,255,255,0.2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:9px;text-align:center
}

/* ANNOUNCEMENT & CHAT AREA */
.chat-section{
  padding:0 12px;display:flex;flex-direction:column;gap:6px;max-height:160px;
  overflow-y:auto;z-index:5
}
.notice-box{
  background:rgba(0,0,0,0.25);border-radius:10px;padding:6px 10px;
  font-size:10px;color:#a7f3d0;line-height:1.3
}
.welcome-banner{
  background:rgba(255,255,255,0.15);padding:4px 12px;border-radius:15px;
  font-size:11px;width:max-content;color:#fff
}
.chat-msg{
  background:rgba(0,0,0,0.3);padding:5px 10px;border-radius:12px;
  font-size:11px;width:max-content;display:flex;align-items:center;gap:6px
}
.badge{padding:1px 5px;border-radius:6px;font-size:8px;font-weight:bold}
.badge-lvl{background:#8b5cf6;color:#fff}
.badge-vip{background:#eab308;color:#000}

/* BOTTOM CONTROL BAR */
.bottom-controls{
  height:60px;padding:0 10px;background:rgba(15,3,35,0.85);
  backdrop-filter:blur(10px);display:flex;align-items:center;
  justify-content:space-between;border-top:1px solid rgba(255,255,255,0.1);z-index:10
}
.say-hi-btn{
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);
  color:#aaa;padding:8px 12px;border-radius:20px;font-size:11px
}
.tool-btn{
  width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  color:#fff;cursor:pointer
}
.gift-box-btn{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,#ff007f,#00f2fe);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 0 10px rgba(255,0,127,0.5)
}
</style>
</head>
<body>

<div id="roomScreen">

  <!-- TOP HEADER BAR -->
  <div class="top-bar">
    <div class="room-profile">
      <img class="avatar-thumb" src="https://i.pravatar.cc/100?img=33" alt="Host">

        <b>জিরো প...</b>

  <div class="trophy-badge">🏆 548.7M &gt;</div>

  <!-- HOST PROFILE -->
  <div class="host-container">

  <!-- BRAND HEADLINE -->
  <div class="brand-title">MRChat</div>

  <!-- 8 MIC SEATS GRID -->
  <div class="seats-grid">
    <div class="seat-item"><div class="seat-icon">💺</div><span class="seat-num">1</span></div>
    <div class="seat-item"><div class="seat-icon">💺</div><span class="seat-num">2</span></div>
    <div class="seat-item"><div class="seat-icon">💺</div><span class="seat-num">3</span></div>
    <div class="seat-item"><div class="seat-icon">💺</div><span class="seat-num">4</span></div>
    <div class="seat-item"><div class="seat-icon">💺</div><span class="seat-num">5</span></div>
    <div class="seat-item"><div class="seat-icon">💺</div><span class="seat-num">6</span></div>
    <div class="seat-item"><div class="seat-icon">💺</div><span class="seat-num">7</span></div>
    <div class="seat-item"><div class="seat-icon">💺</div><span class="seat-num">8</span></div>
  </div>

  <!-- CENTER MASCOT & FLOATING SIDE PANELS -->
  <div class="middle-art">
    <img class="mascot-img" src="https://cdni.iconscout.com/illustration/premium/thumb/cute-cat-playing-guitar-illustration-download-in-svg-png-gif-file-formats--kitten-pet-animal-character-pack-illustrations-5246731.png" alt="Mascot">
    
    <div class="side-widgets">
      <div class="widget-box" style="background:linear-gradient(135deg,#f59e0b,#d97706)">
        <b style="font-size:8px">WEEKLY</b>
        <b>STAR</b>
      </div>
      <div class="widget-box" style="background:linear-gradient(135deg,#10b981,#059669)">
        <span>Lucky fruit</span>
        <b>🎰 30</b>
      </div>
    </div>
  </div>

  <!-- CHAT & ANNOUNCEMENT AREA -->
  <div class="chat-section">
    <div class="notice-box">
      <b>Announcement:</b> আসসালামু আলাইকুম। ভদ্রতা বজায় রাখুন - ধন্যবাদ।
    </div>
    <div class="welcome-banner">
      Welcome <b>༄Mia...✿Vai3</b> to the room
    </div>
    <div class="chat-msg">
      <span class="badge badge-lvl">LV.41</span>
      <span class="badge badge-vip">SVIP2</span>
      <b style="color:#60a5fa">@Mia..Vai:</b> কেমন আছেন প্রিয়
    </div>
  </div>

  <!-- BOTTOM BUTTONS BAR -->
  <div class="bottom-controls">
    <button class="say-hi-btn">Say Hi</button>
    <div class="tool-btn">💬</div>
    <div class="tool-btn">🔊</div>
    <div class="tool-btn">🎙️</div>
    <div class="tool-btn">😊</div>
    <div class="tool-btn">🎛️</div>
    <div class="tool-btn">🎮</div>
    <div class="gift-box-btn">🎁</div>
  </div>

</div>

</body>
</html>
