<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MrChat - Social Voice Chat</title>

  <!-- React Core CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    #root {
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      padding-bottom: 70px;
    }
    /* Header Styles */
    .app-header {
      background: #1e293b;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }
    .brand-title {
      color: #38bdf8;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .coin-badge {
      background: #0f172a;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .coin-text {
      color: #fbbf24;
      font-weight: bold;
    }
    /* Main Content Container */
    .container {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 13px;
    }
    .btn:hover {
      background: #0369a1;
    }
    /* Mic Seats Grid */
    .mic-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    .mic-seat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mic-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #334155;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .mic-label {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
    }
    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: #1e293b;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #334155;
      z-index: 100;
    }
    .nav-item {
      color: #94a3b8;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
      gap: 2px;
    }
    .nav-item.active {
      color: #38bdf8;
      font-weight: bold;
    }
    .nav-icon {
      font-size: 16px;
    }
    /* Modal Window */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal-body {
      background: #1e293b;
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const GIFTS = [
      { id: "g1", name: "Lollipop", price: 100, icon: "🍭" },
      { id: "g2", name: "Rose", price: 500, icon: "🌹" },
      { id: "g3", name: "Golden Veil", price: 10000, icon: "🧕" },
      { id: "g4", name: "Gold Bar", price: 50000, icon: "🧈" },
      { id: "g5", name: "Supercar", price: 1000000, icon: "🏎️" },
      { id: "g6", name: "Golden Sailboat", price: 20000000, icon: "⛵" },
    ];

    const App = () => {
      const [mrCoins, setMrCoins] = useState(20000000);
      const [activeTab, setActiveTab] = useState("home");
      const [currentRoom, setCurrentRoom] = useState(null);
      const [activeGame, setActiveGame] = useState(null);
      const [timer, setTimer] = useState(3600);

      // Hourly Bonus Countdown
      useEffect(() => {
        const interval = setInterval(() => {
          setTimer((prev) => {
            if (prev <= 1) {
              setMrCoins((c) => c + 20000000);
              return 3600;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      return (
        <div>
          <!-- Top Application Bar -->
          <header className="app-header">
            <div className="logo-container">
              <div className="logo-badge">MC</div>
              <span className="brand-title">MrChat</span>
            </div>

            <div className="coin-badge">
              <span style={{ color: '#fbbf24', fontWeight: 'bold' }}>MR</span>
              <span className="coin-text">{mrCoins.toLocaleString()}</span>
            </div>
          </header>

          <!-- Main View -->
          <main className="container">
            {currentRoom ? (
              <RoomView 
                room={currentRoom} 
                onLeave={() => setCurrentRoom(null)} 
                mrCoins={mrCoins}
                setMrCoins={setMrCoins}
                onOpenGame={() => setActiveGame(true)}
              />
            ) : (
              <>
                {activeTab === "home" && (
                  <div>
                    <div className="card" style={{ background: "linear-gradient(135deg, #0f172a, #1e293b)", borderColor: "#38bdf8" }}>
                      <h3>🎙️ Welcome to MrChat</h3>
                      <p style={{ fontSize: "12px", color: "#94a3b8", margin: "6px 0 12px 0" }}>
                        Free-to-use social voice rooms with 0 monetary cost.
                      </p>
                      <button className="btn" onClick={() => setCurrentRoom({ id: "1001", title: "❤️ Chill & Music Room" })}>
                        + Create Voice Room
                      </button>
                    </div>

                    <h4 style={{ margin: "12px 0 8px 0", color: "#94a3b8" }}>Popular Rooms</h4>
                    <div className="card" onClick={() => setCurrentRoom({ id: "1001", title: "❤️ Chill & Music Lounge" })} style={{ cursor: "pointer" }}>
                      <div style={{ display: "flex", justifyBetween: "space-between", alignItems: "center" }}>
                        <div>
                          <strong style={{ fontSize: "14px" }}>❤️ Chill & Music Lounge</strong>
                          <p style={{ fontSize: "11px", color: "#94a3b8" }}>Room ID: 1001 • Host: Alex</p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === "games" && (
                  <div>
                    <h4 style={{ marginBottom: "10px" }}>100% Free MR Coin Mini-Games</h4>
                    <div className="card" style={{ cursor: "pointer" }} onClick={() => setActiveGame(true)}>
                      <div style={{ fontSize: "28px", textAlign: "center" }}>🎲</div>
                      <h4 style={{ textAlign: "center", marginTop: "4px" }}>Dice Challenge</h4>
                      <p style={{ textAlign: "center", fontSize: "11px", color: "#94a3b8" }}>Predict sum of two dice</p>
                    </div>
                  </div>
                )}

                {activeTab === "profile" && (
                  <div className="card">
                    <h3>👤 My Profile</h3>
                    <p style={{ fontSize: "12px", color: "#94a3b8", margin: "6px 0" }}>User ID: 88471029</p>
                    <hr style={{ borderColor: "#334155", margin: "10px 0" }} />
                    <p style={{ fontSize: "12px" }}>⏱️ Next Hourly Bonus (+20M MR):</p>
                    <strong style={{ color: "#38bdf8", fontSize: "18px" }}>{formatTime(timer)}</strong>
                  </div>
                )}
              </>
            )}
          </main>

          <!-- Interactive Dice Game Modal -->
          {activeGame && (
            <div className="modal-overlay">
              <div className="modal-body">
                <div style={{ display: "flex", justifyBetween: "space-between", marginBottom: "12px" }}>
                  <h4>🎲 Dice Challenge Game</h4>
                  <span style={{ cursor: "pointer" }} onClick={() => setActiveGame(false)}>✕</span>
                </div>
                <DiceGame mrCoins={mrCoins} setMrCoins={setMrCoins} />
              </div>
            </div>
          )}

          <!-- Bottom Navigation Bar -->
          <nav className="bottom-nav">
            <div className={`nav-item ${activeTab === 'home' ? 'active' : ''}`} onClick={() => { setActiveTab('home'); setCurrentRoom(null); }}>
              <span className="nav-icon">🏠</span>
              <span>Home</span>
            </div>
            <div className={`nav-item ${activeTab === 'games' ? 'active' : ''}`} onClick={() => { setActiveTab('games'); setCurrentRoom(null); }}>
              <span className="nav-icon">🎲</span>
              <span>Games</span>
            </div>
            <div className={`nav-item ${activeTab === 'profile' ? 'active' : ''}`} onClick={() => { setActiveTab('profile'); setCurrentRoom(null); }}>
              <span className="nav-icon">👤</span>
              <span>Profile</span>
            </div>
          </nav>
        </div>
      );
    };

    // Voice Room Interface
    const RoomView = ({ room, onLeave, mrCoins, setMrCoins, onOpenGame }) => {
      const [messages, setMessages] = useState([{ user: "System", text: "Joined voice room!" }]);
      const [showGifts, setShowGifts] = useState(false);

      const sendGift = (gift) => {
        if (mrCoins < gift.price) {
          alert("Not enough MR Coins!");
          return;
        }
        setMrCoins((c) => c - gift.price);
        setMessages((prev) => [...prev, { user: "You", text: `sent ${gift.icon} ${gift.name}!` }]);
        setShowGifts(false);
      };

      return (
        <div>
          <div className="card" style={{ display: "flex", justifyBetween: "space-between", alignItems: "center" }}>
            <div>
              <strong>{room.title}</strong>
              <p style={{ fontSize: "11px", color: "#94a3b8" }}>ID: {room.id}</p>
            </div>
            <button className="btn" style={{ background: "#ef4444", width: "auto" }} onClick={onLeave}>Leave</button>
          </div>

          <!-- 8 Microphone Seats -->
          <div className="card">
            <p style={{ fontSize: "12px", color: "#94a3b8" }}>Microphone Seats</p>
            <div className="mic-grid">
              {[1, 2, 3, 4, 5, 6, 7, 8].map((s) => (
                <div className="mic-seat" key={s}>
                  <div className="mic-avatar">{s}</div>
                  <span className="mic-label">Seat {s}</span>
                </div>
              ))}
            </div>
          </div>

          <!-- Room Live Messages -->
          <div className="card" style={{ height: "120px", overflowY: "auto" }}>
            {messages.map((m, i) => (
              <p key={i} style={{ fontSize: "12px", marginBottom: "4px" }}>
                <strong style={{ color: "#38bdf8" }}>{m.user}:</strong> {m.text}
              </p>
            ))}
          </div>

          <div style={{ display: "flex", gap: "8px" }}>
            <button className="btn" style={{ background: "#f59e0b" }} onClick={() => setShowGifts(true)}>🎁 Gifts</button>
            <button className="btn" style={{ background: "#8b5cf6" }} onClick={onOpenGame}>🎲 Games</button>
          </div>

          {showGifts && (
            <div className="modal-overlay">
              <div className="modal-body">
                <div style={{ display: "flex", justifyBetween: "space-between", marginBottom: "12px" }}>
                  <h4>Gift Library</h4>
                  <span style={{ cursor: "pointer" }} onClick={() => setShowGifts(false)}>✕</span>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "8px" }}>
                  {GIFTS.map((g) => (
                    <div key={g.id} onClick={() => sendGift(g)} style={{ background: "#0f172a", padding: "8px", borderRadius: "8px", textAlign: "center", cursor: "pointer" }}>
                      <div style={{ fontSize: "20px" }}>{g.icon}</div>
                      <p style={{ fontSize: "10px", margin: "4px 0" }}>{g.name}</p>
                      <p style={{ fontSize: "9px", color: "#f59e0b" }}>{g.price.toLocaleString()} MR</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Dice Game
    const DiceGame = ({ mrCoins, setMrCoins }) => {
      const [bet, setBet] = useState(10000);
      const [result, setResult] = useState(null);

      const roll = (choice) => {
        if (mrCoins < bet) return alert("Not enough MR Coins!");
        const d1 = Math.floor(Math.random() * 6) + 1;
        const d2 = Math.floor(Math.random() * 6) + 1;
        const sum = d1 + d2;

        let win = false;
        if (choice === "LOW" && sum < 7) win = true;
        if (choice === "HIGH" && sum > 7) win = true;

        setMrCoins((c) => win ? c + bet : c - bet);
        setResult({ d1, d2, sum, win });
      };

      return (
        <div>
          <p style={{ fontSize: "12px", marginBottom: "8px" }}>Select Bet Amount:</p>
          <select value={bet} onChange={(e) => setBet(Number(e.target.value))} style={{ width: "100%", padding: "8px", background: "#0f172a", color: "white", border: "1px solid #334155", borderRadius: "6px", marginBottom: "12px" }}>
            <option value={10000}>10,000 MR</option>
            <option value={100000}>100,000 MR</option>
            <option value={1000000}>1,000,000 MR</option>
          </select>

          <div style={{ display: "flex", gap: "8px", marginBottom: "12px" }}>
            <button className="btn" onClick={() => roll("LOW")}>LOW (2-6)</button>
            <button className="btn" style={{ background: "#38bdf8" }} onClick={() => roll("HIGH")}>HIGH (8-12)</button>
          </div>

          {result && (
            <div style={{ padding: "8px", borderRadius: "6px", background: result.win ? "#15803d" : "#991b1b", textAlign: "center", fontSize: "12px" }}>
              Dice: [{result.d1}] + [{result.d2}] = {result.sum} <br />
              {result.win ? `You Won +${bet.toLocaleString()} MR!` : `Lost -${bet.toLocaleString()} MR`}
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
