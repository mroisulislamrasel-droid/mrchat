<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrChat - Voice & Social App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    #app {
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      padding-bottom: 70px;
    }
    .app-header {
      background: #1e293b;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }
    .brand-title {
      color: #38bdf8;
      font-size: 18px;
      font-weight: 800;
    }
    .coin-badge {
      background: #0f172a;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .coin-text {
      color: #fbbf24;
      font-weight: bold;
    }
    .container {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 13px;
      margin-top: 8px;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn-danger {
      background: #ef4444;
    }
    .btn-warning {
      background: #f59e0b;
    }
    .mic-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    .mic-seat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mic-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #334155;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #94a3b8;
    }
    .mic-label {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: #1e293b;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #334155;
      z-index: 100;
    }
    .nav-item {
      color: #94a3b8;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      gap: 2px;
    }
    .nav-item.active {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Top Bar -->
    <header class="app-header">
      <div class="logo-container">
        <div class="logo-badge">MC</div>
        <span class="brand-title">MrChat</span>
      </div>
      <div class="coin-badge">
        <span style="color: #fbbf24; font-weight: bold;">MR</span>
        <span id="coinCount" class="coin-text">20,000,000</span>
      </div>
    </header>

    <!-- Content Area -->
    <main class="container" id="mainContent">
      <!-- Content will be generated dynamically -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('home')">
        <span style="font-size: 16px;">🏠</span>
        <span>Home</span>
      </div>
      <div class="nav-item" onclick="switchTab('games')">
        <span style="font-size: 16px;">🎲</span>
        <span>Games</span>
      </div>
      <div class="nav-item" onclick="switchTab('profile')">
        <span style="font-size: 16px;">👤</span>
        <span>Profile</span>
      </div>
    </nav>
  </div>

  <script>
    let coins = 20000000;
    let currentTab = 'home';
    let inRoom = false;

    function updateCoins() {
      document.getElementById('coinCount').innerText = coins.toLocaleString();
    }

    function switchTab(tab) {
      currentTab = tab;
      inRoom = false;
      
      // Update nav styles
      const items = document.querySelectorAll('.nav-item');
      items.forEach(el => el.classList.remove('active'));
      if(tab === 'home') items[0].classList.add('active');
      if(tab === 'games') items[1].classList.add('active');
      if(tab === 'profile') items[2].classList.add('active');

      render();
    }

    function enterRoom() {
      inRoom = true;
      render();
    }

    function leaveRoom() {
      inRoom = false;
      render();
    }

    function playDice() {
      if (coins < 100000) {
        alert("Not enough coins!");
        return;
      }
      const win = Math.random() > 0.5;
      if (win) {
        coins += 100000;
        alert("🎉 Congratulations! You won 100,000 MR Coins!");
      } else {
        coins -= 100000;
        alert("❌ Bad Luck! You lost 100,000 MR Coins.");
      }
      updateCoins();
    }

    function render() {
      const main = document.getElementById('mainContent');
      
      if (inRoom) {
        main.innerHTML = `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <strong>❤️ Chill & Music Lounge</strong>
                <p style="font-size: 11px; color: #94a3b8;">Room ID: 1001</p>
              </div>
              <button class="btn btn-danger" style="width: auto; padding: 6px 12px;" onclick="leaveRoom()">Leave</button>
            </div>
          </div>

          <div class="card">
            <p style="font-size: 12px; color: #94a3b8;">Microphone Seats</p>
            <div class="mic-grid">
              ${[1,2,3,4,5,6,7,8].map(i => `
                <div class="mic-seat">
                  <div class="mic-avatar">${i === 1 ? 'Host' : i}</div>
                  <span class="mic-label">Seat ${i}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <p style="font-size: 12px; color: #38bdf8;"><strong>System:</strong> Welcome to the Voice Room!</p>
          </div>
        `;
        return;
      }

      if (currentTab === 'home') {
        main.innerHTML = `
          <div class="card" style="background: linear-gradient(135deg, #0f172a, #1e293b); border-color: #38bdf8;">
            <h3>🎙️ Welcome to MrChat</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Free-to-use social voice rooms with 0 monetary cost.</p>
            <button class="btn" onclick="enterRoom()">+ Create Voice Room</button>
          </div>

          <h4 style="margin: 12px 0 8px 0; color: #94a3b8;">Popular Rooms</h4>
          <div class="card" style="cursor: pointer;" onclick="enterRoom()">
            <strong>❤️ Chill & Music Lounge</strong>
            <p style="font-size: 11px; color: #94a3b8; margin-top: 4px;">Room ID: 1001 • 8 Seats Free</p>
          </div>
        `;
      } else if (currentTab === 'games') {
        main.innerHTML = `
          <div class="card" style="text-align: center;">
            <div style="font-size: 36px;">🎲</div>
            <h4>Dice Challenge Mini-Game</h4>
            <p style="font-size: 12px; color: #94a3b8; margin: 8px 0;">Bet 100,000 MR Coins to Win double!</p>
            <button class="btn btn-warning" onclick="playDice()">Roll Dice (100k MR)</button>
          </div>
        `;
      } else if (currentTab === 'profile') {
        main.innerHTML = `
          <div class="card">
            <h3>👤 My Profile</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">User ID: 88471029</p>
            <hr style="border-color: #334155; margin: 12px 0;" />
            <p style="font-size: 12px;">Total MR Coins Balance:</p>
            <strong style="color: #fbbf24; font-size: 20px;">${coins.toLocaleString()} MR</strong>
          </div>
        `;
      }
    }

    // Initial render
    render();
  </script>
</body>
</html>
