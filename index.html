<!-- Prop Warehouse / Inventory Full Modal -->
<div id="warehouse-modal" class="overlay-screen bg-light">
    <!-- Top Bar -->
    <div class="top-nav-bar">
        <i class="fas fa-chevron-left" onclick="closeModal('warehouse-modal')"></i>
        <span class="nav-title">Prop Ware...</span>
        <div class="nav-right-group">
            <span class="tab-toggle active" id="tab-btn-warehouse" onclick="switchWarehouseTab('warehouse')">Warehouse</span>
            <span class="tab-toggle" id="tab-btn-using" onclick="switchWarehouseTab('using')">Using</span>
        </div>
        <button class="btn-select-top">Select</button>
    </div>

    <!-- Sub Navigation Tabs for Categories -->
    <div class="sub-nav-tabs horizontal-scroll">
        <span class="p-tab active" onclick="filterCategory('all')">All</span>
        <span class="p-tab" onclick="filterCategory('frame')">Frame</span>
        <span class="p-tab" onclick="filterCategory('vehicle')">Vehicle</span>
        <span class="p-tab" onclick="filterCategory('theme')">Theme</span>
        <span class="p-tab" onclick="filterCategory('custom_id')">Custom ID</span>
        <span class="p-tab" onclick="filterCategory('ring')">Ring</span>
        <span class="p-tab" onclick="filterCategory('enter_effect')">Enter Effect</span>
        <span class="p-tab" onclick="filterCategory('bubble')">Bubble</span>
    </div>

    <!-- MAIN CONTAINER 1: Prop Warehouse List -->
    <div id="warehouse-view" class="warehouse-body scrollable">
        <div class="prop-grid">
            <!-- Vehicle Item -->
            <div class="prop-card">
                <div class="prop-header">
                    <span>⏱️ 3 days</span>
                    <span class="item-count">x17</span>
                </div>
                <div class="prop-img-box"><img src="https://via.placeholder.com/100?text=Roaring+Lion" alt="Lion Vehicle"></div>
                <div class="prop-actions">
                    <button class="btn-p-send">Send</button>
                    <button class="btn-p-use">Use</button>
                </div>
            </div>

            <!-- Theme Items -->
            <div class="prop-card">
                <div class="prop-header">
                    <span>⏱️ 7 days</span>
                    <span class="item-count">x2</span>
                </div>
                <div class="prop-img-box"><img src="https://via.placeholder.com/100?text=Crystal+Chest" alt="Theme"></div>
                <div class="prop-actions">
                    <button class="btn-p-send">Send</button>
                    <button class="btn-p-use">Use</button>
                </div>
            </div>

            <div class="prop-card">
                <div class="prop-header">
                    <span>⏱️ 1 days</span>
                    <span class="item-count">x14</span>
                </div>
                <div class="prop-img-box"><img src="https://via.placeholder.com/100?text=Golden+Bike" alt="Golden Bike Theme"></div>
                <div class="prop-actions">
                    <button class="btn-p-send">Send</button>
                    <button class="btn-p-use">Use</button>
                </div>
            </div>

            <!-- Custom ID Items -->
            <div class="prop-card">
                <div class="prop-header">
                    <span>⏱️ 7 days</span>
                    <span class="item-count">x36</span>
                </div>
                <div class="prop-img-box">
                    <div class="badge-custom-id">ID<br><small>7/8 DIGITS</small></div>
                </div>
                <div class="prop-actions">
                    <button class="btn-p-send">Send</button>
                    <button class="btn-p-use">Use</button>
                </div>
            </div>

            <!-- Bubble Chat Items -->
            <div class="prop-card">
                <div class="prop-header">
                    <span>⏱️ 1 days</span>
                    <span class="item-count">x57</span>
                </div>
                <div class="prop-img-box">
                    <div class="chat-bubble-preview golden">Hello</div>
                </div>
                <div class="prop-actions">
                    <button class="btn-p-send">Send</button>
                    <button class="btn-p-use">Use</button>
                </div>
            </div>
        </div>

        <!-- Empty State Example (for Enter Effect) -->
        <div id="empty-state" class="empty-state-box d-none">
            <div class="empty-avatar-icon">🐱💬</div>
            <p>List is empty</p>
        </div>
    </div>

    <!-- MAIN CONTAINER 2: Active "Using" List View -->
    <div id="using-view" class="warehouse-body scrollable d-none">
        <div class="prop-grid">
            <!-- Frame Active Item -->
            <div class="prop-card">
                <div class="prop-header">
                    <span>⏱️ 5 days</span>
                    <span class="status-using-text">Using</span>
                </div>
                <div class="prop-img-box">
                    <div class="frame-circle rose-frame"></div>
                </div>
                <button class="btn-p-using-active" disabled>Using</button>
            </div>

            <!-- Other Available Frames to Equip -->
            <div class="prop-card">
                <div class="prop-header">
                    <span>⏱️ 16 days</span>
                    <span class="badge-leader">Leader</span>
                </div>
                <div class="prop-img-box">
                    <div class="frame-circle green-dragon-frame"></div>
                </div>
                <button class="btn-p-use-only">Use</button>
            </div>

            <!-- Vehicle Active Item -->
            <div class="prop-card">
                <div class="prop-header">
                    <span>⏱️ Permanent</span>
                    <span class="status-using-text">Using</span>
                </div>
                <div class="prop-img-box">
                    <div class="avatar-hero-preview">LV.40</div>
                </div>
                <button class="btn-p-using-active" disabled>Using</button>
            </div>

            <div class="prop-card locked-card">
                <div class="prop-header">
                    <span>🔒 Unlock</span>
                </div>
                <div class="prop-img-box"><img src="https://via.placeholder.com/80?text=Dragon" alt="Dragon Vehicle"></div>
                <button class="btn-aristocracy">Aristocracy ></button>
            </div>
        </div>
    </div>
</div>
