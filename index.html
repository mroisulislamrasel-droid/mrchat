<!-- CSS Style (শুধু গেম কন্টেইনারের অভ্যন্তরীণ স্টাইল) -->
<style>
  #game-dashboard-container {
    width: 100%;
    background: #ffffff;
    border-radius: 16px;
    padding: 15px;
    box-sizing: border-box;
  }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .section-title { font-size: 18px; font-weight: bold; color: #333; }
  .coin-badge { display: flex; align-items: center; background: #fff8e1; padding: 4px 10px; border-radius: 20px; color: #d97706; font-weight: bold; font-size: 16px; }
  .coin-icon { width: 20px; height: 20px; background: #fbbf24; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; margin-left: 5px; font-size: 12px; }

  /* Casual Games (3 Columns) */
  .casual-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .casual-card { text-align: center; cursor: pointer; }
  .casual-card img { width: 100%; height: 70px; border-radius: 10px; object-fit: cover; }
  .casual-card p { font-size: 13px; font-weight: 500; margin-top: 4px; color: #333; }

  /* Lucky Games (4 Columns) */
  .lucky-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px 8px; }
  .lucky-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; text-align: center; }
  .lucky-icon-wrapper { position: relative; width: 55px; height: 55px; }
  .lucky-icon-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .red-dot { position: absolute; top: 0; right: 0; width: 10px; height: 10px; background-color: #ff3b30; border-radius: 50%; border: 2px solid #fff; }
  .lucky-item p { font-size: 11px; color: #333; margin-top: 4px; line-height: 1.2; font-weight: 500; }
</style>

<!-- JavaScript লজিক -->
<script>
  // গেম বাটন প্রেস করলে আপনার অ্যাপের ভেতরে এই ভিউটি দেখাবে
  function toggleGameDashboard() {
    const gameContainer = document.getElementById('game-dashboard-container');
    if (gameContainer.style.display === "none" || gameContainer.style.display === "") {
      gameContainer.style.display = "block";
    } else {
      gameContainer.style.display = "none";
    }
  }

  // পরবর্তীতে প্রতিটি বাটনে ক্লিক করলে নির্দিষ্ট গেম চালু করার লজিক
  function launchGame(selectedGame) {
    console.log("Launching: " + selectedGame);
    // এখানে আপনার নির্দিষ্ট গেম চালু করার কোড বা রিডাইরেক্ট বসাবেন
    alert(selectedGame + " গেম চালু হচ্ছে...");
  }
</script>
