<!-- Language Selection Modal -->
<div id="language-modal" class="overlay-screen bg-light">
    <div class="top-nav-bar">
        <i class="fas fa-chevron-left" onclick="closeModal('language-modal')"></i>
        <span class="nav-title">Language</span>
        <span class="nav-right text-cyan font-bold" onclick="saveLanguage()">Save</span>
    </div>

    <div class="language-list scrollable">
        <div class="lang-item active" onclick="selectLanguage(this)">English</div>
        <div class="lang-item" onclick="selectLanguage(this)">हिन्दी</div>
        <div class="lang-item" onclick="selectLanguage(this)">বাংলা</div>
        <div class="lang-item" onclick="selectLanguage(this)">ਪੰਜਾਬੀ</div>
        <div class="lang-item" onclick="selectLanguage(this)">தமிழ்</div>
        <div class="lang-item" onclick="selectLanguage(this)">తెలుగు</div>
        <div class="lang-item" onclick="selectLanguage(this)">اردو</div>
        <div class="lang-item" onclick="selectLanguage(this)">العربية</div>
        <div class="lang-item" onclick="selectLanguage(this)">Türkçe</div>
        <div class="lang-item" onclick="selectLanguage(this)">ไทย</div>
        <div class="lang-item" onclick="selectLanguage(this)">Tiếng Việt</div>
        <div class="lang-item" onclick="selectLanguage(this)">Malay</div>
        <div class="lang-item" onclick="selectLanguage(this)">Português</div>
    </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal" class="overlay-screen bg-light">
    <div class="top-nav-bar">
        <i class="fas fa-chevron-left" onclick="closeModal('settings-modal')"></i>
        <span class="nav-title">Settings</span>
    </div>

    <div class="settings-list">
        <div class="setting-item" onclick="openModal('account-binding-modal')">
            <div class="setting-left">
                <i class="far fa-check-circle"></i>
                <span>Account Binding</span>
            </div>
            <div class="setting-right">
                <i class="fas fa-exclamation-circle text-red"></i>
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>

        <div class="setting-item" onclick="clearCache()">
            <div class="setting-left">
                <i class="fas fa-trash-alt"></i>
                <span>Clear Cache</span>
            </div>
            <div class="setting-right">
                <span class="text-gray" id="cache-size">49MB</span>
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>

        <div class="setting-item" onclick="openModal('blacklist-modal')">
            <div class="setting-left">
                <i class="fas fa-user-slash"></i>
                <span>Blacklist</span>
            </div>
            <div class="setting-right">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>

        <div class="setting-item" onclick="openModal('policy-modal')">
            <div class="setting-left">
                <i class="far fa-list-alt"></i>
                <span>APP POLICY</span>
            </div>
            <div class="setting-right">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>

        <div class="setting-item">
            <div class="setting-left">
                <i class="fas fa-exclamation-circle"></i>
                <span>Current Version</span>
            </div>
            <div class="setting-right">
                <span class="text-gray">3.8.2</span>
            </div>
        </div>

        <div class="setting-item" onclick="openModal('other-modal')">
            <div class="setting-left">
                <i class="fas fa-ellipsis-h"></i>
                <span>Other</span>
            </div>
            <div class="setting-right">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>

        <div class="setting-item" onclick="uploadLog()">
            <div class="setting-left">
                <i class="fas fa-upload"></i>
                <span>Upload Log</span>
            </div>
            <div class="setting-right">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
    </div>

    <!-- Bottom Action Floating Buttons -->
    <div class="settings-bottom-actions">
        <div class="profile-avatar-mini">
            <img src="https://via.placeholder.com/40" alt="Profile">
            <span class="online-indicator">✓</span>
        </div>
        <div class="btn-add-account">+</div>
        <div class="btn-logout-power"><i class="fas fa-power-off"></i></div>
    </div>
</div>

<!-- Feedback Modal -->
<div id="feedback-modal" class="overlay-screen bg-light">
    <div class="top-nav-bar">
        <i class="fas fa-chevron-left" onclick="closeModal('feedback-modal')"></i>
        <span class="nav-title">Feedback</span>
    </div>

    <div class="feedback-body scrollable">
        <label class="fb-label">Choose a type</label>
        <div class="type-grid">
            <button class="fb-type-btn active" onclick="selectFeedbackType(this)">App error</button>
            <button class="fb-type-btn" onclick="selectFeedbackType(this)">Recharge/Wallet</button>
            <button class="fb-type-btn" onclick="selectFeedbackType(this)">Suggestion</button>
            <button class="fb-type-btn" onclick="selectFeedbackType(this)">Account Appeal</button>
        </div>

        <label class="fb-label">Problem Description</label>
        <textarea class="fb-textarea" placeholder="Enter problem details here"></textarea>

        <label class="fb-label">Upload Screenshot <small>(Optional)</small></label>
        <div class="upload-box">
            <input type="file" id="fb-screenshot" hidden accept="image/*" onchange="previewScreenshot(event)">
            <div class="upload-btn" onclick="document.getElementById('fb-screenshot').click()">+</div>
            <div id="screenshot-preview" class="screenshot-preview d-none"></div>
        </div>

        <label class="fb-label">Contact <small>(Optional)</small></label>
        <input type="text" class="fb-input" placeholder="Mobile phone or Email address">

        <button class="btn-complete-gradient" onclick="submitFeedback()">Complete</button>
    </div>
</div>
