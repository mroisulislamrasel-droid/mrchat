<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Sprite Sheet Demo</title>
    <style>
        canvas {
            border: 2px solid #333;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <h3>স্প্রাইট অ্যানিমেশন প্রিভিউ:</h3>
    <canvas id="gameCanvas" width="200" height="200"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        const frameWidth = 64; 
        const frameHeight = 64; 
        const totalFrames = 4; 
        const frameRate = 500; 
        
        let currentFrame = 0;

        // অ্যানিমেশন ফ্রেম আপডেট
        setInterval(() => {
            currentFrame = (currentFrame + 1) % totalFrames;
        }, frameRate);

        // ক্যানভাসে ড্র করার মূল ফাংশন
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // ক্যানভাস পরিষ্কার করা

            // ফ্রেম ব্যাকগ্রাউন্ড
            ctx.fillStyle = "#4CAF50";
            ctx.fillRect(10, 10, frameWidth, frameHeight);

            // ফ্রেমে নম্বর প্রদর্শন
            ctx.fillStyle = "#ffffff";
            ctx.font = "20px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("F-" + currentFrame, 10 + frameWidth/2, 10 + frameHeight/2);

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
