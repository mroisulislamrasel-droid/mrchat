<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrChat - Social Voice Chat</title>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      padding-bottom: 70px;
    }
    .app-header {
      background: #1e293b;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    .app-header h1 {
      color: #38bdf8;
      font-size: 22px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .btn:disabled {
      background: #475569;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #1e293b;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #334155;
      z-index: 1000;
    }
    .nav-item {
      color: #94a3b8;
      text-decoration: none;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .nav-item.active {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Mini Dice Game Component
    const DiceGame = ({ balance, setBalance }) => {
      const [betAmount, setBetAmount] = useState(10000);
      const [prediction, setPrediction] = useState("HIGH");
      const [result, setResult] = useState(null);

      const handleRoll = () => {
        if (balance < betAmount) {
          alert("পর্যাপ্ত MR Coins নেই!");
          return;
        }

        const dice1 = Math.floor(Math.random() * 6) + 1;
        const dice2 = Math.floor(Math.random() * 6) + 1;
        const sum = dice1 + dice2;

        let won = false;
        if (prediction === "LOW" && sum >= 2 && sum <= 6) won = true;
        if (prediction === "SEVEN" && sum === 7) won = true;
        if (prediction === "HIGH" && sum >= 8 && sum <= 12) won = true;

        const payout = won ? (prediction === "SEVEN" ? betAmount * 5 : betAmount * 2) : 0;
        const newBalance = won ? balance + payout : balance - betAmount;

        setBalance(newBalance);
        setResult({ dice1, dice2, sum, won, payout });
      };

      return (
        <div className="card">
          <h3>🎲 Dice Challenge Game</h3>
          <p style={{ margin: "8px 0" }}>ব্যালেন্স: <strong>{balance.toLocaleString()} MR</strong></p>
          
          <div style={{ margin: "12px 0" }}>
            <label>বাজির পরিমাণ: </label>
            <select 
              value={betAmount} 
              onChange={(e) => setBetAmount(Number(e.target.value))}
              style={{ padding: "6px", borderRadius: "4px", background: "#334155", color: "#fff", border: "none" }}
            >
              <option value={10000}>10,000 MR</option>
              <option value={100000}>100,000 MR</option>
              <option value={1000000}>1,000,000 MR</option>
            </select>
          </div>

          <div style={{ display: "flex", gap: "8px", marginBottom: "12px" }}>
            <button 
              onClick={() => setPrediction("LOW")} 
              style={{ flex: 1, padding: "8px", background: prediction === "LOW" ? "#38bdf8" : "#334155", color: "#fff", border: "none", borderRadius: "6px" }}
            >
              LOW (2-6)
            </button>
            <button 
              onClick={() => setPrediction("SEVEN")} 
              style={{ flex: 1, padding: "8px", background: prediction === "SEVEN" ? "#38bdf8" : "#334155", color: "#fff", border: "none", borderRadius: "6px" }}
            >
              SEVEN (7)
            </button>
            <button 
              onClick={() => setPrediction("HIGH")} 
              style={{ flex: 1, padding: "8px", background: prediction === "HIGH" ? "#38bdf8" : "#334155", color: "#fff", border: "none", borderRadius: "6px" }}
            >
              HIGH (8-12)
            </button>
          </div>

          <button className="btn" onClick={handleRoll}>ROLL DICE</button>

          {result && (
            <div style={{ marginTop: "12px", padding: "10px", background: result.won ? "#15803d" : "#991b1b", borderRadius: "6px" }}>
              ডাইস: [{result.dice1}] + [{result.dice2}] = মোট {result.sum} <br />
              {result.won ? `আপনি জিতেছেন +${result.payout.toLocaleString()} MR!` : "আবার চেষ্টা করুন!"}
            </div>
          )}
        </div>
      );
    };

    // Main App Component
    const App = () => {
      const [activeTab, setActiveTab] = useState("Home");
      const [balance, setBalance] = useState(20000000); // 20 Million MR Coins Initial

      return (
        <div>
          <header className="app-header">
            <h1>MrChat</h1>
            <p style={{ fontSize: "12px", color: "#94a3b8" }}>Real-Time Social Voice Room Platform</p>
          </header>

          <div className="container">
            <div className="card" style={{ background: "linear-gradient(135deg, #1e293b, #0f172a)", borderColor: "#38bdf8" }}>
              <h2>💰 My MR Coins</h2>
              <h1 style={{ color: "#38bdf8", margin: "10px 0" }}>{balance.toLocaleString()} MR</h1>
              <p style={{ fontSize: "12px", color: "#94a3b8" }}>প্রতি ১ ঘণ্টায় স্বয়ংক্রিয়ভাবে +২০,০০০,০০০ MR যোগ হবে।</p>
            </div>

            {activeTab === "Home" && (
              <div>
                <div className="card">
                  <h3>🎙️ রিয়েল-টাইম ভয়েস রুম</h3>
                  <p style={{ margin: "8px 0", color: "#94a3b8" }}>জনপ্রিয় ভয়েস রুমে যোগ দিন বা নিজের রুম তৈরি করুন।</p>
                  <button className="btn">নতুন রুম তৈরি করুন</button>
                </div>
                <DiceGame balance={balance} setBalance={setBalance} />
              </div>
            )}

            {activeTab === "Live" && <div className="card"><h3>📡 Live Stream & Rooms</h3><p>লাইভ রুমের তালিকা এখানে দেখাবে...</p></div>}
            {activeTab === "Room" && <div className="card"><h3>🎙️ Voice Room</h3><p>আপনার ভয়েস চ্যানেল নিয়ন্ত্রণের প্যানেল...</p></div>}
            {activeTab === "Message" && <div className="card"><h3>💬 Messages</h3><p>প্রাইভেট মেসেজ ও চ্যাট...</p></div>}
            {activeTab === "Profile" && (
              <div className="card">
                <h3>👤 Profile Overview</h3>
                <p>User ID: 88471029</p>
                <p>Level: LV 1</p>
                <p>VIP Status: NONE</p>
              </div>
            )}
          </div>

          <nav className="bottom-nav">
            <div className={`nav-item ${activeTab === 'Home' ? 'active' : ''}`} onClick={() => setActiveTab('Home')}>🏠<br/>Home</div>
            <div className={`nav-item ${activeTab === 'Live' ? 'active' : ''}`} onClick={() => setActiveTab('Live')}>📡<br/>Live</div>
            <div className={`nav-item ${activeTab === 'Room' ? 'active' : ''}`} onClick={() => setActiveTab('Room')}>🎙️<br/>Room</div>
            <div className={`nav-item ${activeTab === 'Message' ? 'active' : ''}`} onClick={() => setActiveTab('Message')}>💬<br/>Message</div>
            <div className={`nav-item ${activeTab === 'Profile' ? 'active' : ''}`} onClick={() => setActiveTab('Profile')}>👤<br/>Profile</div>
          </nav>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
