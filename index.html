<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Lobby</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .coin-badge {
      display: flex;
      align-items: center;
      background: #fff8e1;
      padding: 6px 12px;
      border-radius: 20px;
      color: #d97706;
      font-weight: bold;
      font-size: 18px;
    }

    .coin-icon {
      width: 24px;
      height: 24px;
      background: #fbbf24;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      margin-left: 6px;
    }

    /* Casual Games (3 Columns) */
    .casual-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .casual-card {
      background: #fff;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .casual-card:hover {
      transform: scale(1.05);
    }

    .casual-card img {
      width: 100%;
      height: 70px;
      object-fit: cover;
      border-radius: 12px;
    }

    .casual-card p {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    /* Lucky Games (4 Columns) */
    .lucky-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px 10px;
    }

    .lucky-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
      text-align: center;
    }

    .lucky-item:hover {
      transform: scale(1.05);
    }

    .lucky-icon-wrapper {
      position: relative;
      width: 60px;
      height: 60px;
    }

    .lucky-icon-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Notification Red Dot */
    .red-dot {
      position: absolute;
      top: 0;
      right: 2px;
      width: 12px;
      height: 12px;
      background-color: #ff3b30;
      border-radius: 50%;
      border: 2px solid white;
    }

    .lucky-item p {
      margin-top: 6px;
      font-size: 12px;
      color: #333;
      font-weight: 500;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Header with Coins -->
    <div class="top-bar">
      <h2 class="section-title">Casual Games</h2>
      <div class="coin-badge">
        180.7K <span class="coin-icon">★</span>
      </div>
    </div>

    <!-- Casual Games Grid -->
    <div class="casual-grid">
      <div class="casual-card" onclick="openGame('Ludo')">
        <img src="https://via.placeholder.com/100x70/007bff/ffffff?text=LUDO" alt="Ludo">
        <p>Ludo</p>
      </div>
      <div class="casual-card" onclick="openGame('Ludo Team')">
        <img src="https://via.placeholder.com/100x70/28a745/ffffff?text=TEAM" alt="Ludo Team">
        <p>Ludo Team</p>
      </div>
      <div class="casual-card" onclick="openGame('Carrom')">
        <img src="https://via.placeholder.com/100x70/dc3545/ffffff?text=CARROM" alt="Carrom">
        <p>Carrom</p>
      </div>
      <div class="casual-card" onclick="openGame('UMO')">
        <img src="https://via.placeholder.com/100x70/ffc107/ffffff?text=UMO" alt="UMO">
        <p>UMO</p>
      </div>
      <div class="casual-card" onclick="openGame('Domino')">
        <img src="https://via.placeholder.com/100x70/17a2b8/ffffff?text=DOMINO" alt="Domino">
        <p>Domino</p>
      </div>
      <div class="casual-card" onclick="openGame('Jackaroo')">
        <img src="https://via.placeholder.com/100x70/6c757d/ffffff?text=JACKAROO" alt="Jackaroo">
        <p>Jackaroo</p>
      </div>
    </div>

    <!-- Lucky Game Title -->
    <h2 class="section-title" style="margin-bottom: 15px;">Lucky Game</h2>

    <!-- Lucky Games Grid -->
    <div class="lucky-grid">
      
      <div class="lucky-item" onclick="openGame('Lucky Fruit')">
        <div class="lucky-icon-wrapper">
          <img src="https://via.placeholder.com/60/ff9900/ffffff?text=Fruit" alt="Lucky Fruit">
        </div>
        <p>Lucky fruit</p>
      </div>

      <div class="lucky-item" onclick="openGame('Greedy Pro')">
        <div class="lucky-icon-wrapper">
          <img src="https://via.placeholder.com/60/9900cc/ffffff?text=Greedy" alt="Greedy Pro">
        </div>
        <p>Greedy Pro</p>
      </div>

      <div class="lucky-item" onclick="openGame('Jackpot')">
        <div class="lucky-icon-wrapper">
          <img src="https://via.placeholder.com/60/ff0066/ffffff?text=Jackpot" alt="Jackpot">
        </div>
        <p>Jackpot</p>
      </div>

      <div class="lucky-item" onclick="openGame('Teen Patti')">
        <div class="lucky-icon-wrapper">
          <img src="https://via.placeholder.com/60/009966/ffffff?text=Patti" alt="Teen Patti">
        </div>
        <p>Teen Patti</p>
      </div>

      <div class="lucky-item" onclick="openGame('Lucky Pro')">
        <div class="lucky-icon-wrapper">
          <img src="https://via.placeholder.com/60/cc0000/ffffff?text=Pro" alt="Lucky Pro">
        </div>
        <p>Lucky Pro</p>
      </div>

      <div class="lucky-item" onclick="openGame('Greedy Box')">
        <div class="lucky-icon-wrapper">
          <img src="https://via.placeholder.com/60/ffcc00/ffffff?text=Box" alt="Greedy Box">
          <span class="red-dot"></span>
        </div>
        <p>Greedy Box</p>
      </div>

      <div class="lucky-item" onclick="openGame('Jackpot Slot')">
        <div class="lucky-icon-wrapper">
          <img src="https://via.placeholder.com/60/3366cc/ffffff?text=Slot" alt="Jackpot Slot">
          <span class="red-dot"></span>
        </div>
        <p>Jackpot slot</p>
      </div>

      <div class="lucky-item" onclick="openGame('Dragon Tiger Slot')">
        <div class="lucky-icon-wrapper">
          <img src="https://via.placeholder.com/60/ff3300/ffffff?text=VS" alt="Dragon Tiger">
          <span class="red-dot"></span>
        </div>
        <p>Dragon Tiger Slot</p>
      </div>

      <div class="lucky-item" onclick="openGame('Roulette')">
        <div class="lucky-icon-wrapper">
          <img src="https://via.placeholder.com/60/663399/ffffff?text=Roulette" alt="Roulette">
          <span class="red-dot"></span>
        </div>
        <p>Roulette</p>
      </div>

      <div class="lucky-item" onclick="openGame('Texas Cowboy')">
        <div class="lucky-icon-wrapper">
          <img src="https://via.placeholder.com/60/996633/ffffff?text=Cowboy" alt="Texas Cowboy">
          <span class="red-dot"></span>
        </div>
        <p>Texas Cowboy</p>
      </div>

    </div>

  </div>

  <script>
    // গেম বাটনে ক্লিক করলে এই ফাংশনটি কাজ করবে
    function openGame(gameName) {
      alert(gameName + " গেমটি ওপেন হচ্ছে...");
      
      /* 
         পরবর্তীতে আসল গেম কানেক্ট করার জন্য নিচের মতো রিডাইরেক্ট কোড ব্যবহার করতে পারেন:
         
         if(gameName === 'Ludo') {
             window.location.href = "ludo-game.html";
         } else if(gameName === 'Carrom') {
             window.location.href = "carrom-game.html";
         }
      */
    }
  </script>

</body>
</html>
